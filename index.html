<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0e14">
  <title>Gerador de Senhas Temporárias</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="title">
      <header class="card-header">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </div>
        <div>
          <h1 id="title">Gerador de Senhas Temporárias</h1>
          <p class="subtitle">Senhas aleatórias e seguras, geradas no seu navegador.</p>
        </div>
      </header>

      <div class="password-box">
        <div class="password" id="password" tabindex="0" aria-label="Senha gerada"></div>
        <button type="button" class="icon-btn" id="regen" aria-label="Gerar nova senha" title="Gerar nova senha">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"/>
            <path d="M21 4v5h-5"/>
          </svg>
        </button>
      </div>

      <div class="strength" id="strength" data-level="strong">
        <div class="strength-head">
          <span class="strength-title">Força da senha</span>
          <span class="strength-label" id="strengthLabel">Forte</span>
        </div>
        <div class="strength-bar" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="strength-info"><span id="strengthBits">0</span> bits de entropia · <span id="strengthTip"></span></p>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="length">Tamanho da senha</label>
          <output class="length-value" id="lengthValue" for="length">16</output>
        </div>
        <input type="range" id="length" min="4" max="32" step="1" value="16" aria-valuemin="4" aria-valuemax="32">
        <div class="range-ends" aria-hidden="true"><span>4</span><span>32</span></div>
      </div>

      <fieldset class="options">
        <legend>Tipos de caracteres</legend>

        <label class="check">
          <input type="checkbox" id="optUpper" checked>
          <span class="box" aria-hidden="true"></span>
          <span class="check-text">Letras maiúsculas <small>A-Z</small></span>
        </label>

        <label class="check">
          <input type="checkbox" id="optLower" checked>
          <span class="box" aria-hidden="true"></span>
          <span class="check-text">Letras minúsculas <small>a-z</small></span>
        </label>

        <label class="check">
          <input type="checkbox" id="optNumbers" checked>
          <span class="box" aria-hidden="true"></span>
          <span class="check-text">Números <small>0-9</small></span>
        </label>

        <label class="check">
          <input type="checkbox" id="optSymbols" checked>
          <span class="box" aria-hidden="true"></span>
          <span class="check-text">Símbolos <small>!@#$%^&amp;*</small></span>
        </label>
      </fieldset>

      <p class="notice" id="notice" role="alert" hidden></p>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="generate">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
          </svg>
          Gerar nova senha
        </button>

        <button type="button" class="btn btn-secondary" id="copy">
          <svg class="ico-copy" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="12" height="12" rx="2"/>
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
          </svg>
          <svg class="ico-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12 5 5 9-10"/>
          </svg>
          <span id="copyLabel">Copiar</span>
        </button>
      </div>
    </section>

    <footer class="foot">Nada é enviado ou armazenado: a senha existe só nesta página.</footer>
  </main>

  <div class="sr-only" id="live" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
